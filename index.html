
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123B68">

    <title>EduSim | Plataforma de Simuladores</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-container">

            <!-- Encabezado -->
            <div class="brand-section">
                <div class="brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>

                <h1>EduSim</h1>

                <p class="brand-subtitle">
                    Plataforma de Simuladores Educativos
                </p>
            </div>

            <!-- Tarjeta de acceso -->
            <section class="login-card">

                <div class="login-heading">
                    <h2>Bienvenido</h2>
                    <p>Ingresa tu contraseña para continuar</p>
                </div>

                <form id="loginForm">

                    <div class="mb-4">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Escribe tu contraseña"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Mostrar contraseña"
                            >
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <div id="loginError" class="login-error">
                            <i class="bi bi-exclamation-circle"></i>
                            Contraseña incorrecta. Inténtalo nuevamente.
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <span>Ingresar a la plataforma</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>

                </form>

                <div class="login-footer">
                    <i class="bi bi-shield-lock"></i>
                    Acceso privado a la plataforma
                </div>

            </section>

            <!-- Pie de página -->
            <footer class="page-footer">
                <p>EduSim &copy; 2026</p>
                <span>Aprendizaje · Conocimiento · Evaluación</span>
            </footer>

        </div>

    </main>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
